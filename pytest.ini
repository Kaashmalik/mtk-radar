[pytest]
# Single source of truth for the Python test suite.
#
# CI, scripts/verify.sh and `pnpm test` all run bare `pytest`, so a suite
# cannot silently disappear from one runner while another keeps executing it.
# Add every new test directory here, never in one runner only.
testpaths =
    packages/object_storage/tests
    packages/source_adapters/tests
    packages/worker_heartbeat/tests
    services/api/tests
    workers/verification/tests
    workers/render/tests
    workers/capture/tests
    workers/publishing/tests
    workers/metrics/tests
    workers/batch/tests
    workers/monitor/tests
    scripts/tests
