<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>MTK RADAR</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b93ff"/>
      <stop offset="1" stop-color="#3dd6c3"/>
    </linearGradient>
    <linearGradient id="beam" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#0b0d12" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0d12" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <style>
    /* Browsers that animate SVG favicons (Firefox) sweep the beam. */
    .beam { transform-origin: 32px 32px; animation: sweep 3.6s linear infinite; }
    .blip { animation: ping 3.6s ease-out infinite; }
    @keyframes sweep { to { transform: rotate(360deg); } }
    @keyframes ping { 0%, 100% { opacity: 0.35; } 8% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .beam, .blip { animation: none; } }
  </style>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <g fill="none" stroke="#0b0d12" stroke-width="3" stroke-opacity="0.55">
    <circle cx="32" cy="32" r="21"/>
    <circle cx="32" cy="32" r="12"/>
  </g>
  <path class="beam" d="M32 32V11a21 21 0 0 1 18.2 10.5Z" fill="url(#beam)"/>
  <circle cx="32" cy="32" r="4" fill="#0b0d12"/>
  <circle class="blip" cx="43" cy="21.5" r="3.2" fill="#0b0d12"/>
</svg>
