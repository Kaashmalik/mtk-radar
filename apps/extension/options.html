<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MTK RADAR — extension settings</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin: 0.8rem 0 0.2rem; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 0.4rem 0.5rem; }
      .hint { color: #666; font-size: 12px; }
      button { margin-top: 1rem; padding: 0.4rem 1rem; cursor: pointer; }
      #status { margin-left: 0.8rem; color: #1a7f37; }
    </style>
  </head>
  <body>
    <h1>MTK RADAR AI — Save Page settings</h1>
    <p class="hint">
      The API URL points at your MTK RADAR API. The token is the shared worker
      token (<code>MTK_API_TOKEN</code>) — required whenever the API is not
      running in open local-dev mode. Get it from your deployment operator.
    </p>
    <form id="form">
      <label for="apiBase">API URL</label>
      <input id="apiBase" name="apiBase" type="url" placeholder="http://localhost:8000" required />
      <label for="token">API token (bearer)</label>
      <input id="token" name="token" type="password" autocomplete="off" placeholder="paste MTK_API_TOKEN" />
      <label for="handle">Account handle (optional)</label>
      <input id="handle" name="handle" type="text" placeholder="which account/context saved this" />
      <button type="submit">Save</button>
      <span id="status" role="status"></span>
    </form>
    <script src="options.js"></script>
  </body>
</html>
