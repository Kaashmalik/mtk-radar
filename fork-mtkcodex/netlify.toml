# Netlify (free plan allows commercial sites). Netlify detects Next.js and
# applies its OpenNext adapter automatically; security headers, redirects and
# API routes all come from next.config.ts and src/app.
# Setup guide: docs/CRM.md → "Step 0 — Hosting on Netlify".

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Skip Next.js telemetry in CI.
  NEXT_TELEMETRY_DISABLED = "1"
