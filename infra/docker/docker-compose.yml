name: mtk-radar

# Week 12 hardening: restart policies, healthchecks, env-driven credentials,
# optional worker services (profiles: workers) — see docs/runbook.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mtk
      # default is dev-only; set POSTGRES_PASSWORD in .env for anything real
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtk}
      POSTGRES_DB: mtk_radar
    # Private by default: only the compose network may reach the database.
    # Publish 5432 only through docker-compose.dev.yml for host tooling.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # NOTE: no /docker-entrypoint-initdb.d mount — schema is owned by the
      # migration runner (the `migrate` one-shot service runs
      # services/api/db_migrate.py automatically before the API starts,
      # recording applied files in schema_migrations). Feeding initdb.d
      # directly would apply migrations that never get recorded.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtk -d mtk_radar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- S3-compatible object storage (v0.15, profile: storage) -------------
  # Renders/captions/captures become portable s3:// refs in the DB. Start the
  # stack with --profile workers --profile storage; set MTK_STORAGE_BACKEND=s3
  # plus MTK_S3_* (see .env.example) so workers publish refs.
  minio:
    profiles: ["storage"]
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MTK_S3_ACCESS_KEY:-mtk-storage}
      MINIO_ROOT_PASSWORD: ${MTK_S3_SECRET_KEY:-mtk-storage-secret}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage-init:
    profiles: ["storage"]
    image: quay.io/minio/mc:RELEASE.2024-06-13T16-04-24Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
             mc mb --ignore-existing local/$${MTK_S3_BUCKET:-mtk-radar}"
    environment:
      MINIO_ROOT_USER: ${MTK_S3_ACCESS_KEY:-mtk-storage}
      MINIO_ROOT_PASSWORD: ${MTK_S3_SECRET_KEY:-mtk-storage-secret}
      MTK_S3_BUCKET: ${MTK_S3_BUCKET:-mtk-radar}

  # ---- one-shot schema migration ------------------------------------------
  # Boot is self-configuring: migrations apply before the API starts, so a
  # fresh host needs no manual `docker compose exec api python db_migrate.py`.
  # The runner records applied migrations in schema_migrations and is
  # idempotent — an upgrade roll applies only the new files.
  migrate:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: mtk-radar-api:local
    restart: "no"
    environment:
      DATABASE_URL: postgresql://mtk:${POSTGRES_PASSWORD:-mtk}@postgres:5432/mtk_radar
    command: python db_migrate.py
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: mtk-radar-api:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mtk:${POSTGRES_PASSWORD:-mtk}@postgres:5432/mtk_radar
      REDIS_URL: redis://redis:6379/0
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_WORKER_TOKEN: ${MTK_WORKER_TOKEN:-}
      MTK_EXTENSION_TOKEN: ${MTK_EXTENSION_TOKEN:-}
      # WP01: shared with the verification worker; unsigned machine evidence is
      # refused by default. Unset ⇒ machine evidence cannot be accepted (503).
      MTK_FETCH_SIGNING_KEY: ${MTK_FETCH_SIGNING_KEY:-}
      MTK_REQUIRE_FETCH_SIGNATURE: ${MTK_REQUIRE_FETCH_SIGNATURE:-1}
      # WP01: promotion refuses machine evidence without an extraction coverage
      # record. Unset defaults to required; 0 is a legacy-migration opt-out.
      MTK_REQUIRE_EXTRACTION_COVERAGE: ${MTK_REQUIRE_EXTRACTION_COVERAGE:-1}
      # WP01: evidence ingest refuses machine collection for a source without a
      # recorded terms-of-service review. Unset defaults to required.
      MTK_REQUIRE_TOS_ATTESTATION: ${MTK_REQUIRE_TOS_ATTESTATION:-1}
      # WP01: a review expires after this many days (1..3650, default 180);
      # expired reviews stop new machine collection until re-recorded.
      MTK_TOS_REVIEW_TTL_DAYS: ${MTK_TOS_REVIEW_TTL_DAYS:-180}
      # public origin of the dashboard — enables §11 correction links in
      # scheduled captions (schedules_state.platform_metadata)
      MTK_PUBLIC_BASE_URL: ${MTK_PUBLIC_BASE_URL:-}
      # browser origins allowed to call the API (comma separated). The
      # dashboard's client islands are subject to CORS — a wrong allowlist
      # breaks every interactive action in the browser.
      MTK_CORS_ORIGINS: ${MTK_CORS_ORIGINS:-}
      # v0.30 preflight reads the same storage config as the workers. The API
      # never touches media bytes; this only proves the configured backend is
      # complete before automation is armed.
      MTK_STORAGE_BACKEND: ${MTK_STORAGE_BACKEND:-}
      # Shared named volume; workers mount the SAME volume at /data so
      # local:// refs resolve identically on every container.
      MTK_STORAGE_LOCAL_ROOT: ${MTK_STORAGE_LOCAL_ROOT:-/data}
      MTK_S3_ENDPOINT: ${MTK_S3_ENDPOINT:-http://minio:9000}
      MTK_S3_BUCKET: ${MTK_S3_BUCKET:-mtk-radar}
      MTK_S3_ACCESS_KEY: ${MTK_S3_ACCESS_KEY:-mtk-storage}
      MTK_S3_SECRET_KEY: ${MTK_S3_SECRET_KEY:-mtk-storage-secret}
      MTK_S3_REGION: ${MTK_S3_REGION:-us-east-1}
      # §7.F.2: the YouTube-derived composite growth score stays disabled
      # until a compliance review approves it. Set to 1 only after that review.
      MTK_ENABLE_GROWTH_SCORE: ${MTK_ENABLE_GROWTH_SCORE:-0}
      # G13 (costs WP-F): the API owns the ledger and budget gate — it needs
      # the endpoint config it PROBES (Settings → Costs) and the price table
      # behind every USD ESTIMATE. The workers receive their spending knobs
      # separately (verification: VERIFY_LLM_*; render: TTS_*).
      VERIFY_LLM_BASE_URL: ${VERIFY_LLM_BASE_URL:-}
      VERIFY_LLM_API_KEY: ${VERIFY_LLM_API_KEY:-}
      VERIFY_LLM_MODEL: ${VERIFY_LLM_MODEL:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      COST_LLM_INPUT_PER_MTOK: ${COST_LLM_INPUT_PER_MTOK:-0.15}
      COST_LLM_OUTPUT_PER_MTOK: ${COST_LLM_OUTPUT_PER_MTOK:-0.60}
      COST_TTS_PER_MCHAR: ${COST_TTS_PER_MCHAR:-15.0}
    volumes:
      - storage-data:/data
    ports:
      # Loopback only: the dashboard proxies every browser request. Squid, a
      # reverse proxy, or a private network may still reach the API directly.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5

  dashboard:
    # Immutable production build (no `npm install`/dev server at runtime).
    # Use docker-compose.dev.yml for the live-reloading development setup.
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    image: mtk-radar-dashboard:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:8000
      # server-side (Node) reads only - never inlined into the browser bundle.
      # Interactive actions use the signed HttpOnly reviewer session; the
      # browser never holds MTK_API_TOKEN or the reviewer token itself.
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      # Required: without a valid secret the dashboard fails closed and only
      # /login renders (with a configuration error).
      MTK_SESSION_SECRET: ${MTK_SESSION_SECRET:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

  # ---- optional workers (docker compose --profile workers up) -------------
  publishing:
    profiles: ["workers"]
    image: mtk-radar-workers:local
    build:
      context: ../..
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    working_dir: /repo
    # Code and system dependencies are baked into mtk-radar-workers:local.
    volumes:
      - storage-data:/data
      - storage-cache:/repo/.storage-cache
    environment:
      API_URL: http://api:8000
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_WORKER_TOKEN: ${MTK_WORKER_TOKEN:-}
      MTK_STORAGE_BACKEND: ${MTK_STORAGE_BACKEND:-}
      MTK_STORAGE_LOCAL_ROOT: ${MTK_STORAGE_LOCAL_ROOT:-/data}
      MTK_STORAGE_CACHE: ${MTK_STORAGE_CACHE:-/repo/.storage-cache}
      MTK_S3_ENDPOINT: ${MTK_S3_ENDPOINT:-http://minio:9000}
      MTK_S3_BUCKET: ${MTK_S3_BUCKET:-mtk-radar}
      MTK_S3_ACCESS_KEY: ${MTK_S3_ACCESS_KEY:-mtk-storage}
      MTK_S3_SECRET_KEY: ${MTK_S3_SECRET_KEY:-mtk-storage-secret}
      MTK_S3_REGION: ${MTK_S3_REGION:-us-east-1}
      MTK_PUBLISH_MAX_RETRIES: ${MTK_PUBLISH_MAX_RETRIES:-3}
      MTK_PUBLISH_RETRY_BASE_S: ${MTK_PUBLISH_RETRY_BASE_S:-300}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REFRESH_TOKEN: ${TIKTOK_REFRESH_TOKEN:-}
      TIKTOK_APP_AUDITED: ${TIKTOK_APP_AUDITED:-0}
      MTK_PUBLISH_BREAKER_THRESHOLD: ${MTK_PUBLISH_BREAKER_THRESHOLD:-3}
      MTK_PUBLISH_BREAKER_COOLDOWN_S: ${MTK_PUBLISH_BREAKER_COOLDOWN_S:-900}
      # G13: Instagram Graph publishing (v0.19) + public media URL + Meta
      # long-lived token refresh (WP-G) — documented in .env.example, consumed
      # here (and INSTAGRAM_* also by the metrics adapters below).
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      MTK_PUBLIC_MEDIA_BASE_URL: ${MTK_PUBLIC_MEDIA_BASE_URL:-}
      MTK_TOKEN_REFRESH_CADENCE_D: ${MTK_TOKEN_REFRESH_CADENCE_D:-45}
      MTK_TOKEN_REFRESH_MARGIN_D: ${MTK_TOKEN_REFRESH_MARGIN_D:-14}
    command: >
      python workers/publishing/main.py --api http://api:8000
    depends_on:
      api:
        condition: service_healthy

  verification:
    profiles: ["workers"]
    image: mtk-radar-workers:local
    build:
      context: ../..
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    working_dir: /repo
    # Code and system dependencies are baked into mtk-radar-workers:local.
    # EP-07: undeliverable cost telemetry survives restarts in the outbox.
    volumes:
      - outbox-data:/var/lib/mtk-outbox
    environment:
      API_URL: http://api:8000
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_WORKER_TOKEN: ${MTK_WORKER_TOKEN:-}
      MTK_OUTBOX_DIR: /var/lib/mtk-outbox
      # Shared with the API: unsigned machine evidence is refused.
      MTK_FETCH_SIGNING_KEY: ${MTK_FETCH_SIGNING_KEY:-}
      MTK_FETCH_IDENTITY: ${MTK_FETCH_IDENTITY:-verification-worker}
      MTK_REQUIRE_TOS_ATTESTATION: ${MTK_REQUIRE_TOS_ATTESTATION:-1}
      # G13: LLM extraction (§5.6.3 + costs WP-F) — the API probes the SAME
      # endpoint configuration for Settings → Costs, so both sides receive
      # the same documented values. Unset ⇒ deterministic rules path only.
      VERIFY_LLM_BASE_URL: ${VERIFY_LLM_BASE_URL:-}
      VERIFY_LLM_API_KEY: ${VERIFY_LLM_API_KEY:-}
      VERIFY_LLM_MODEL: ${VERIFY_LLM_MODEL:-}
      VERIFY_LLM_TIMEOUT_S: ${VERIFY_LLM_TIMEOUT_S:-45}
      VERIFY_LLM_MAX_ATTEMPTS: ${VERIFY_LLM_MAX_ATTEMPTS:-3}
      VERIFY_LLM_MAX_CALLS_PER_RUN: ${VERIFY_LLM_MAX_CALLS_PER_RUN:-12}
      VERIFY_LLM_MAX_OUTPUT_TOKENS: ${VERIFY_LLM_MAX_OUTPUT_TOKENS:-2000}
    command: >
      python workers/verification/main.py
    depends_on:
      api:
        condition: service_healthy

  collectors:
    profiles: ["workers"]
    image: mtk-radar-workers:local
    build:
      context: ../..
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    working_dir: /repo
    # Code and system dependencies are baked into mtk-radar-workers:local.
    environment:
      API_URL: http://api:8000
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_WORKER_TOKEN: ${MTK_WORKER_TOKEN:-}
      # G13: the trend adapters' shared payload cache (same Redis as the API).
      # The collector also runs fine without it — in-process memory only —
      # but a value documented in .env.example implies the container gets it.
      REDIS_URL: redis://redis:6379/0
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    command: >
      python workers/collectors/main.py --api http://api:8000
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  batch:
    profiles: ["workers"]
    image: mtk-radar-workers:local
    build:
      context: ../..
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    working_dir: /repo
    # Code and system dependencies are baked into mtk-radar-workers:local.
    environment:
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_WORKER_TOKEN: ${MTK_WORKER_TOKEN:-}
      MTK_BATCH_INTERVAL: ${MTK_BATCH_INTERVAL:-900}
    command: >
      sh -c "python workers/batch/main.py --api http://api:8000 --interval ${MTK_BATCH_INTERVAL:-900}"
    depends_on:
      api:
        condition: service_healthy

  render:
    profiles: ["workers"]
    image: mtk-radar-workers:local
    build:
      context: ../..
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    working_dir: /repo
    # Render writes projects (intermediate media) and materializes remote
    # assets into a cache; both are explicit writable named volumes.
    volumes:
      - storage-data:/data
      - storage-cache:/repo/.storage-cache
      - render-projects:/repo/projects
      - outbox-data:/var/lib/mtk-outbox
    environment:
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_WORKER_TOKEN: ${MTK_WORKER_TOKEN:-}
      MTK_OUTBOX_DIR: /var/lib/mtk-outbox
      MTK_STORAGE_BACKEND: ${MTK_STORAGE_BACKEND:-}
      MTK_STORAGE_LOCAL_ROOT: ${MTK_STORAGE_LOCAL_ROOT:-/data}
      MTK_STORAGE_CACHE: ${MTK_STORAGE_CACHE:-/repo/.storage-cache}
      MTK_S3_ENDPOINT: ${MTK_S3_ENDPOINT:-http://minio:9000}
      MTK_S3_BUCKET: ${MTK_S3_BUCKET:-mtk-radar}
      MTK_S3_ACCESS_KEY: ${MTK_S3_ACCESS_KEY:-mtk-storage}
      MTK_S3_SECRET_KEY: ${MTK_S3_SECRET_KEY:-mtk-storage-secret}
      MTK_S3_REGION: ${MTK_S3_REGION:-us-east-1}
      # G13: TTS narration (optional; falls back to capture audio when unset
      # or the daily char budget is exhausted). Language overrides follow the
      # TTS_<KEY>_<LANGCODE> convention documented in .env.example.
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-tts-1}
      TTS_VOICE: ${TTS_VOICE:-onyx}
      TTS_BASE_URL_UR: ${TTS_BASE_URL_UR:-}
      TTS_API_KEY_UR: ${TTS_API_KEY_UR:-}
      TTS_MODEL_UR: ${TTS_MODEL_UR:-}
      TTS_VOICE_UR: ${TTS_VOICE_UR:-}
      # M7: 1 = the TTS endpoint is a self-hosted, keyless, free server. Only
      # honoured for loopback/private/compose-service hosts (fail-closed).
      TTS_LOCAL: ${TTS_LOCAL:-0}
      # M1: x264 speed/size trade-off for the delivery encode.
      MTK_RENDER_X264_PRESET: ${MTK_RENDER_X264_PRESET:-medium}
      # v0.29 measured QC — see docs/render-qc.md. Blank inherits the code default.
      MTK_RENDER_QC_TARGET_LUFS: ${MTK_RENDER_QC_TARGET_LUFS:-}
      MTK_RENDER_QC_LUFS_TOLERANCE: ${MTK_RENDER_QC_LUFS_TOLERANCE:-}
      MTK_RENDER_QC_MAX_TRUE_PEAK: ${MTK_RENDER_QC_MAX_TRUE_PEAK:-}
      MTK_RENDER_QC_REQUIRE_AUDIO: ${MTK_RENDER_QC_REQUIRE_AUDIO:-}
      MTK_RENDER_QC_MIN_VIDEO_BPS: ${MTK_RENDER_QC_MIN_VIDEO_BPS:-}
      MTK_RENDER_QC_MIN_AUDIO_BPS: ${MTK_RENDER_QC_MIN_AUDIO_BPS:-}
      MTK_RENDER_QC_DURATION_TOLERANCE_S: ${MTK_RENDER_QC_DURATION_TOLERANCE_S:-}
      MTK_RENDER_QC_DURATION_TOLERANCE_RATIO: ${MTK_RENDER_QC_DURATION_TOLERANCE_RATIO:-}
      MTK_RENDER_QC_MAX_BLACK_S: ${MTK_RENDER_QC_MAX_BLACK_S:-}
      MTK_RENDER_QC_MAX_FREEZE_S: ${MTK_RENDER_QC_MAX_FREEZE_S:-}
      MTK_RENDER_QC_MAX_SILENCE_S: ${MTK_RENDER_QC_MAX_SILENCE_S:-}
      MTK_RENDER_QC_BLACK_PIXEL_THRESHOLD: ${MTK_RENDER_QC_BLACK_PIXEL_THRESHOLD:-}
      MTK_RENDER_QC_FREEZE_NOISE: ${MTK_RENDER_QC_FREEZE_NOISE:-}
      MTK_RENDER_QC_SILENCE_NOISE_DB: ${MTK_RENDER_QC_SILENCE_NOISE_DB:-}
      MTK_RENDER_QC_PROBE_TIMEOUT_S: ${MTK_RENDER_QC_PROBE_TIMEOUT_S:-}
      MTK_RENDER_QC_DECODE_TIMEOUT_S: ${MTK_RENDER_QC_DECODE_TIMEOUT_S:-}
      MTK_RENDER_QC_CAPTION_SAFE_FRACTION: ${MTK_RENDER_QC_CAPTION_SAFE_FRACTION:-}
      MTK_RENDER_QC_CAPTION_MAX_LINES: ${MTK_RENDER_QC_CAPTION_MAX_LINES:-}
      MTK_RENDER_QC_EXEMPT_RANGES: ${MTK_RENDER_QC_EXEMPT_RANGES:-}
    # ffmpeg is baked into the image; the render queue serves itself.
    command: >
      python workers/render/main.py --sweep --watch --api http://api:8000 --out ./projects
    depends_on:
      api:
        condition: service_healthy

  monitor:
    profiles: ["workers"]
    image: mtk-radar-workers:local
    build:
      context: ../..
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    working_dir: /repo
    # Code and system dependencies are baked into mtk-radar-workers:local.
    # EP-07: notifications that failed to send are replayed from the outbox.
    volumes:
      - outbox-data:/var/lib/mtk-outbox
    environment:
      API_URL: http://api:8000
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_WORKER_TOKEN: ${MTK_WORKER_TOKEN:-}
      MTK_OUTBOX_DIR: /var/lib/mtk-outbox
      MTK_PUBLIC_BASE_URL: ${MTK_PUBLIC_BASE_URL:-}
      # Optional alert delivery. Blank values disable that channel; the
      # monitor still logs every alert. See docs/notifications.md.
      MTK_NOTIFY_WEBHOOK_URL: ${MTK_NOTIFY_WEBHOOK_URL:-}
      MTK_NOTIFY_WEBHOOK_TOKEN: ${MTK_NOTIFY_WEBHOOK_TOKEN:-}
      MTK_NOTIFY_EMAIL_TO: ${MTK_NOTIFY_EMAIL_TO:-}
      MTK_SMTP_HOST: ${MTK_SMTP_HOST:-}
      MTK_SMTP_PORT: ${MTK_SMTP_PORT:-587}
      MTK_SMTP_USER: ${MTK_SMTP_USER:-}
      MTK_SMTP_PASSWORD: ${MTK_SMTP_PASSWORD:-}
      MTK_SMTP_FROM: ${MTK_SMTP_FROM:-}
      MTK_SMTP_STARTTLS: ${MTK_SMTP_STARTTLS:-1}
      MTK_SMTP_SSL: ${MTK_SMTP_SSL:-0}
      MTK_NOTIFY_TIMEOUT_S: ${MTK_NOTIFY_TIMEOUT_S:-10}
      MTK_NOTIFY_COOLDOWN_S: ${MTK_NOTIFY_COOLDOWN_S:-3600}
      MTK_NOTIFY_SUBJECT_PREFIX: "${MTK_NOTIFY_SUBJECT_PREFIX:-[MTK RADAR]}"
    command: >
      python workers/monitor/main.py --api http://api:8000 --interval 300
    depends_on:
      api:
        condition: service_healthy

  metrics:
    profiles: ["workers"]
    image: mtk-radar-workers:local
    build:
      context: ../..
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    working_dir: /repo
    # Code and system dependencies are baked into mtk-radar-workers:local.
    environment:
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_WORKER_TOKEN: ${MTK_WORKER_TOKEN:-}
      MTK_METRICS_INTERVAL: ${MTK_METRICS_INTERVAL:-3600}
      # platform credentials are the SAME env references the publishing worker
      # uses (§6) — the metrics worker only ever reads via the adapters.
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      # G13: the metrics adapters read Instagram insights with the SAME
      # credential references as publishing (§6).
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
    command: >
      sh -c "python workers/metrics/main.py --api http://api:8000 --interval ${MTK_METRICS_INTERVAL:-3600}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  minio-data:
  storage-data:
  storage-cache:
  render-projects:
  outbox-data:
