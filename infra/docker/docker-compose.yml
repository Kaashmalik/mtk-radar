name: mtk-radar

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mtk
      POSTGRES_PASSWORD: mtk
      POSTGRES_DB: mtk_radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../services/api/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtk -d mtk_radar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../services/api
    environment:
      DATABASE_URL: postgresql://mtk:mtk@postgres:5432/mtk_radar
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    image: node:22-alpine
    working_dir: /app
    environment:
      API_URL: http://api:8000
    volumes:
      - ../../apps/dashboard:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
