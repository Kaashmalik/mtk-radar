name: mtk-radar

# Week 12 hardening: restart policies, healthchecks, env-driven credentials,
# optional worker services (profiles: workers) — see docs/runbook.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mtk
      # default is dev-only; set POSTGRES_PASSWORD in .env for anything real
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtk}
      POSTGRES_DB: mtk_radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # NOTE: no /docker-entrypoint-initdb.d mount — schema is owned by the
      # migration runner (`pnpm migrate` / services/api/db_migrate.py), which
      # records applied migrations in schema_migrations. Feeding initdb.d
      # directly would apply migrations that never get recorded, so a later
      # `pnpm migrate` re-runs them and fails on "already exists".
      # On first boot run: docker compose exec api python db_migrate.py
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtk -d mtk_radar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- S3-compatible object storage (v0.15, profile: storage) -------------
  # Renders/captions/captures become portable s3:// refs in the DB. Start the
  # stack with --profile workers --profile storage; set MTK_STORAGE_BACKEND=s3
  # plus MTK_S3_* (see .env.example) so workers publish refs.
  minio:
    profiles: ["storage"]
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MTK_S3_ACCESS_KEY:-mtk-storage}
      MINIO_ROOT_PASSWORD: ${MTK_S3_SECRET_KEY:-mtk-storage-secret}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage-init:
    profiles: ["storage"]
    image: quay.io/minio/mc:RELEASE.2024-06-13T16-04-24Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
             mc mb --ignore-existing local/$${MTK_S3_BUCKET:-mtk-radar}"
    environment:
      MINIO_ROOT_USER: ${MTK_S3_ACCESS_KEY:-mtk-storage}
      MINIO_ROOT_PASSWORD: ${MTK_S3_SECRET_KEY:-mtk-storage-secret}
      MTK_S3_BUCKET: ${MTK_S3_BUCKET:-mtk-radar}

  api:
    build:
      context: ../../services/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mtk:${POSTGRES_PASSWORD:-mtk}@postgres:5432/mtk_radar
      REDIS_URL: redis://redis:6379/0
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      # public origin of the dashboard — enables §11 correction links in
      # scheduled captions (schedules_state.platform_metadata)
      MTK_PUBLIC_BASE_URL: ${MTK_PUBLIC_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5

  dashboard:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      API_URL: http://api:8000
      # server-side (Node) reads only — never inlined into the browser bundle;
      # interactive islands use personal reviewer tokens (v0.16, minted with
      # scripts/mint_reviewer.py). NEXT_PUBLIC_API_TOKEN is deliberately gone:
      # the browser must never hold the master secret.
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:8000}
    volumes:
      - ../../apps/dashboard:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # ---- optional workers (docker compose --profile workers up) -------------
  publishing:
    profiles: ["workers"]
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    environment:
      API_URL: http://api:8000
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_STORAGE_BACKEND: ${MTK_STORAGE_BACKEND:-}
      MTK_STORAGE_LOCAL_ROOT: ${MTK_STORAGE_LOCAL_ROOT:-./storage}
      MTK_STORAGE_CACHE: ${MTK_STORAGE_CACHE:-./.storage-cache}
      MTK_S3_ENDPOINT: ${MTK_S3_ENDPOINT:-http://minio:9000}
      MTK_S3_BUCKET: ${MTK_S3_BUCKET:-mtk-radar}
      MTK_S3_ACCESS_KEY: ${MTK_S3_ACCESS_KEY:-mtk-storage}
      MTK_S3_SECRET_KEY: ${MTK_S3_SECRET_KEY:-mtk-storage-secret}
      MTK_S3_REGION: ${MTK_S3_REGION:-us-east-1}
      MTK_PUBLISH_MAX_RETRIES: ${MTK_PUBLISH_MAX_RETRIES:-3}
      MTK_PUBLISH_RETRY_BASE_S: ${MTK_PUBLISH_RETRY_BASE_S:-300}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REFRESH_TOKEN: ${TIKTOK_REFRESH_TOKEN:-}
    command: >
      sh -c "pip install -q -r workers/publishing/requirements.txt httpx &&
             python workers/publishing/main.py --api http://api:8000"
    depends_on:
      api:
        condition: service_healthy

  collectors:
    profiles: ["workers"]
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    environment:
      API_URL: http://api:8000
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    command: >
      sh -c "pip install -q httpx feedparser &&
             python workers/collectors/main.py --api http://api:8000"
    depends_on:
      api:
        condition: service_healthy

  batch:
    profiles: ["workers"]
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    environment:
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_BATCH_INTERVAL: ${MTK_BATCH_INTERVAL:-900}
    command: >
      sh -c "pip install -q httpx &&
             python workers/batch/main.py --api http://api:8000 --interval ${MTK_BATCH_INTERVAL:-900}"
    depends_on:
      api:
        condition: service_healthy

  render:
    profiles: ["workers"]
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /repo
    volumes:
      - ../..:/repo
    environment:
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_STORAGE_BACKEND: ${MTK_STORAGE_BACKEND:-}
      MTK_STORAGE_LOCAL_ROOT: ${MTK_STORAGE_LOCAL_ROOT:-./storage}
      MTK_STORAGE_CACHE: ${MTK_STORAGE_CACHE:-./.storage-cache}
      MTK_S3_ENDPOINT: ${MTK_S3_ENDPOINT:-http://minio:9000}
      MTK_S3_BUCKET: ${MTK_S3_BUCKET:-mtk-radar}
      MTK_S3_ACCESS_KEY: ${MTK_S3_ACCESS_KEY:-mtk-storage}
      MTK_S3_SECRET_KEY: ${MTK_S3_SECRET_KEY:-mtk-storage-secret}
      MTK_S3_REGION: ${MTK_S3_REGION:-us-east-1}
    # ffmpeg is installed on first start; the render queue then serves itself
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq ffmpeg > /dev/null &&
             pip install -q httpx &&
             python workers/render/main.py --sweep --watch --api http://api:8000 --out ./projects"
    depends_on:
      api:
        condition: service_healthy

  monitor:
    profiles: ["workers"]
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    environment:
      API_URL: http://api:8000
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
    command: >
      sh -c "pip install -q httpx &&
             python workers/monitor/main.py --api http://api:8000 --interval 300"
    depends_on:
      api:
        condition: service_healthy

  metrics:
    profiles: ["workers"]
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    environment:
      MTK_API_TOKEN: ${MTK_API_TOKEN:-}
      MTK_METRICS_INTERVAL: ${MTK_METRICS_INTERVAL:-3600}
      # platform credentials are the SAME env references the publishing worker
      # uses (§6) — the metrics worker only ever reads via the adapters.
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
    command: >
      sh -c "pip install -q httpx &&
             python workers/metrics/main.py --api http://api:8000 --interval ${MTK_METRICS_INTERVAL:-3600}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  minio-data:
  storage-cache:
