# Dependency automation: weekly grouped updates. The pnpm lockfile is pinned
# (packageManager: pnpm@10.34.7) so Dependabot's npm ecosystem handles the
# workspace; pip covers the API + workers; the docker images track the
# postgres major we actually deploy.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # pnpm workspace root (apps + packages via the lockfile)
    schedule:
      interval: "weekly"
    groups:
      js-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/api"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "monthly"
    ignore:
      # major bumps of the data directory need a migration runbook, not a bot
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
